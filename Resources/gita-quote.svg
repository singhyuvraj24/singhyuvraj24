<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="170" viewBox="0 0 1100 170" role="img" aria-labelledby="title desc">
  <title id="title">Bhagavad Gita verse 2.47</title>
  <desc id="desc">Karmanye vadhikaraste ma phaleshu kadachana. Ma karma phala hetur bhur ma te sango stva karmani.</desc>
  <rect width="1100" height="170" rx="12" fill="#000000"/>
  <text x="550" y="72" text-anchor="middle" fill="#f5f5f5" font-family="Noto Sans Devanagari, sans-serif" font-size="26" font-weight="400" word-spacing="4">कर्मण्येवाधिकारस्ते मा फलेषु कदाचन। मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥</text>
  <text x="550" y="132" text-anchor="middle" fill="#d4af37" font-family="Noto Sans Devanagari, sans-serif" font-size="14" font-weight="400">— श्रीमद्भगवद्गीता २.४७</text>
</svg>
